[build]
  command = "npm run build"
  publish = "app/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Fonty z polskimi znakami dla PDF (@react-pdf) — czytane z dysku w runtime.
  # @react-pdf/pdfkit ładuje standardowe fonty dynamicznie — nie bundlować, dołączyć pakiet w całości.
  external_node_modules = ["@react-pdf/renderer"]
  included_files = ["node_modules/dejavu-fonts-ttf/ttf/DejaVuSans.ttf", "node_modules/dejavu-fonts-ttf/ttf/DejaVuSans-Bold.ttf", "node_modules/pdfkit/js/standard-fonts/**"]

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"

# SPA — wszystkie ścieżki poza /api/* serwuje index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Nagłówki dla odpowiedzi statycznych (CDN). Odpowiedzi funkcji ustawiają nagłówki w kodzie.
# script-src: hash = preamble React Refresh wstrzykiwany przez Vite wyłącznie pod `netlify dev`
# (build produkcyjny nie zawiera skryptów inline); `unsafe-inline` nie jest dopuszczony.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://www.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
